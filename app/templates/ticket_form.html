{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<h3 class="mb-3">{{ title }}</h3>

<form method="post" style="max-width: 500px">
    <div class="mb-3">
        <label class="form-label" for="screening_id">Сеанс</label>
        <select class="form-select" id="screening_id" name="screening_id">
            <option value="">— выберите сеанс —</option>
            {% for s in screenings %}
            <option value="{{ s.id }}" {% if form.screening_id == s.id|string %}selected{% endif %}>
                {{ s.start_time.strftime("%d.%m %H:%M") }} — {{ s.film.title }}, зал {{ s.hall }}, {{ s.price }} ₽
            </option>
            {% endfor %}
        </select>
    </div>
    <div class="row mb-3">
        <div class="col">
            <label class="form-label" for="row_num">Ряд (1–10)</label>
            <input class="form-control" id="row_num" name="row_num" value="{{ form.row_num }}">
        </div>
        <div class="col">
            <label class="form-label" for="seat_num">Место (1–12)</label>
            <input class="form-control" id="seat_num" name="seat_num" value="{{ form.seat_num }}">
        </div>
    </div>
    <button class="btn btn-primary">Сохранить</button>
    <a class="btn btn-secondary" href="/">Отмена</a>
</form>
{% endblock %}
