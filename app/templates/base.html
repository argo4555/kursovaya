<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Кинотеатр{% endblock %} — Кинотеатр «Звезда»</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
{% if user %}
<nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Кинотеатр «Звезда»</a>
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="/">Билеты</a></li>
            {% if user.role == "admin" %}
            <li class="nav-item"><a class="nav-link" href="/screenings">Сеансы</a></li>
            <li class="nav-item"><a class="nav-link" href="/films">Фильмы</a></li>
            {% endif %}
        </ul>
        <span class="navbar-text me-3">{{ user.full_name }}</span>
        <a class="btn btn-outline-light btn-sm" href="/logout">Выход</a>
    </div>
</nav>
{% endif %}

<div class="container mt-4">
    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
